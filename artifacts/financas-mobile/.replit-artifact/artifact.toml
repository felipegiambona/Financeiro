kind = "mobile"
previewPath = "/financas-mobile/"
title = "Finanças Mobile"
description = "Aplicativo mobile de controle financeiro pessoal em português do Brasil, com dashboard, lançamentos, previsão de saldo e gráficos mensais persistidos localmente."
version = "1.0.0"
id = "artifacts/financas-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/financas-mobile/" ]
localPort = 18255

[services.development]
run = "pnpm --filter @workspace/financas-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/financas-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/financas-mobile", "run", "serve" ]

[services.env]
PORT = "18255"
BASE_PATH = "/financas-mobile/"
