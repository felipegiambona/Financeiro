openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Authenticated financial transaction operations
  - name: wallets
    description: Authenticated wallet management operations
  - name: categories
    description: Authenticated category management operations
  - name: limits
    description: Authenticated spending limit management operations
  - name: goals
    description: Authenticated savings goal management operations
  - name: account
    description: Authenticated account management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      responses:
        "200":
          description: User transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: clearTransactions
      tags: [transactions]
      responses:
        "204":
          description: Transactions removed
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "204":
          description: Transaction removed
        "404":
          description: Not found
  /transactions/{id}/occurrences/{occurrenceDate}/payment-status:
    patch:
      operationId: updateTransactionOccurrencePaymentStatus
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - name: occurrenceDate
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
  /transactions/batch-delete:
    post:
      operationId: deleteTransactions
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBatchDelete"
      responses:
        "204":
          description: Transactions removed
  /transactions/batch-update:
    post:
      operationId: updateTransactions
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBatchUpdate"
      responses:
        "204":
          description: Transactions updated
  /wallets:
    get:
      operationId: listWallets
      tags: [wallets]
      responses:
        "200":
          description: User wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
    post:
      operationId: createWallet
      tags: [wallets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletInput"
      responses:
        "201":
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      responses:
        "200":
          description: User categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Category removed
        "404":
          description: Not found
  /limits:
    get:
      operationId: listLimits
      tags: [limits]
      responses:
        "200":
          description: User spending limits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Limit"
    post:
      operationId: createLimit
      tags: [limits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitInput"
      responses:
        "201":
          description: Created spending limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limit"
  /limits/{id}:
    patch:
      operationId: updateLimit
      tags: [limits]
      parameters:
        - $ref: "#/components/parameters/LimitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitUpdate"
      responses:
        "200":
          description: Updated spending limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limit"
        "404":
          description: Not found
    delete:
      operationId: deleteLimit
      tags: [limits]
      parameters:
        - $ref: "#/components/parameters/LimitId"
      responses:
        "204":
          description: Spending limit removed
        "404":
          description: Not found
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      responses:
        "200":
          description: User savings goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "204":
          description: Goal removed
        "404":
          description: Not found
  /wallets/{id}:
    patch:
      operationId: updateWallet
      tags: [wallets]
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletUpdate"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: Not found
    delete:
      operationId: deleteWallet
      tags: [wallets]
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "204":
          description: Wallet removed
        "404":
          description: Not found
  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the authenticated account
      responses:
        "204":
          description: Account and all financial data removed
        "401":
          description: Unauthorized
  /account/profile:
    patch:
      operationId: updateAccountProfile
      tags: [account]
      summary: Update the authenticated user's profile name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "204":
          description: Profile updated
        "400":
          description: Invalid profile name
        "401":
          description: Unauthorized
  /account/profile-image:
    patch:
      operationId: updateAccountProfileImage
      tags: [account]
      summary: Update the authenticated user's profile image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImageUpdate"
      responses:
        "204":
          description: Profile image updated
        "400":
          description: Invalid image
        "401":
          description: Unauthorized
components:
  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WalletId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LimitId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
      required:
        - firstName
    ProfileImageUpdate:
      type: object
      properties:
        data:
          type: string
          minLength: 1
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required:
        - data
        - mimeType
    Recurrence:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, recurring, installment]
        interval:
          type: integer
          minimum: 1
        unit:
          type: string
          enum: [day, week, month, year]
        period:
          type: string
          enum: [fixed, weekly, biweekly, monthly, bimonthly, quarterly, semiannual, annual]
        frequency:
          type: string
          enum: [monthly, weekly, yearly]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        occurrences:
          type: integer
          minimum: 1
        excludedDates:
          type: array
          items:
            type: string
            format: date
        amountMode:
          type: string
          enum: [installment, total]
    Transaction:
      type: object
      required: [id, walletId, destinationWalletId, categoryId, type, amount, description, date, recurrence, paymentStatus, paymentStatusOverrides, createdAt]
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        destinationWalletId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        goalId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [income, expense, transfer] }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string }
        date: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        paymentStatus: { type: string, enum: [paid, unpaid] }
        paymentStatusOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [paid, unpaid]
        createdAt: { type: string, format: date-time }
    TransactionInput:
      type: object
      required: [type, amount, description, date, recurrence, paymentStatus]
      properties:
        walletId: { type: string, format: uuid }
        destinationWalletId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        goalId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [income, expense, transfer] }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string, minLength: 1 }
        date: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        paymentStatus: { type: string, enum: [paid, unpaid] }
    TransactionUpdate:
      type: object
      properties:
        walletId: { type: string, format: uuid }
        destinationWalletId: { type: string, format: uuid, nullable: true }
        categoryId: { type: string, format: uuid, nullable: true }
        goalId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [income, expense, transfer] }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string, minLength: 1 }
        date: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        paymentStatus: { type: string, enum: [paid, unpaid] }
        paymentStatusOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [paid, unpaid]
    PaymentStatusUpdate:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus: { type: string, enum: [paid, unpaid] }
    TransactionBatchDelete:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    TransactionBatchUpdate:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        paymentStatus: { type: string, enum: [paid, unpaid] }
    Wallet:
      type: object
      required: [id, title, initialBalance, icon, isDefault, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        initialBalance: { type: number }
        icon:
          type: string
          enum: [wallet-outline]
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
    WalletInput:
      type: object
      required: [title, initialBalance]
      properties:
        title: { type: string, minLength: 1 }
        initialBalance: { type: number }
        icon:
          type: string
          enum: [wallet-outline]
    WalletUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        initialBalance: { type: number }
        icon:
          type: string
          enum: [wallet-outline]
    Category:
      type: object
      required: [id, name, color, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        createdAt: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
    CategoryUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        color: { type: string }
    LimitPeriod:
      type: string
      enum: [weekly, biweekly, monthly, bimonthly, quarterly, semiannual, annual]
    Limit:
      type: object
      required: [id, categoryId, description, amount, period, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        description: { type: ["string", "null"] }
        amount: { type: number, exclusiveMinimum: 0 }
        period:
          $ref: "#/components/schemas/LimitPeriod"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LimitInput:
      type: object
      required: [categoryId, amount, period]
      properties:
        categoryId: { type: string, format: uuid }
        description: { type: ["string", "null"] }
        amount: { type: number, exclusiveMinimum: 0 }
        period:
          $ref: "#/components/schemas/LimitPeriod"
    LimitUpdate:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        description: { type: ["string", "null"] }
        amount: { type: number, exclusiveMinimum: 0 }
        period:
          $ref: "#/components/schemas/LimitPeriod"
    Goal:
      type: object
      required: [id, title, targetAmount, savedAmount, imageData, deadline, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        targetAmount: { type: number, exclusiveMinimum: 0 }
        savedAmount: { type: number, minimum: 0 }
        imageData: { type: ["string", "null"] }
        deadline: { type: ["string", "null"], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GoalInput:
      type: object
      required: [title, targetAmount]
      properties:
        title: { type: string, minLength: 1 }
        targetAmount: { type: number, exclusiveMinimum: 0 }
        imageData: { type: ["string", "null"] }
        deadline: { type: ["string", "null"], format: date }
    GoalUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        targetAmount: { type: number, exclusiveMinimum: 0 }
        imageData: { type: ["string", "null"] }
        deadline: { type: ["string", "null"], format: date }

