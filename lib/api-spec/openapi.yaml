openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Authenticated financial transaction operations
  - name: wallets
    description: Authenticated wallet management operations
  - name: categories
    description: Authenticated category management operations
  - name: limits
    description: Authenticated spending limit management operations
  - name: goals
    description: Authenticated savings goal management operations
  - name: cards
    description: Authenticated credit card management operations
  - name: account
    description: Authenticated account management operations
  - name: financial-profiles
    description: Financial profile management operations
  - name: investments
    description: Personal investment portfolio operations
  - name: legal
    description: Public legal documents and contact information
  - name: privacy
    description: Authenticated data subject rights and consent operations
  - name: support
    description: Authenticated support requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /financial-profiles:
    get:
      operationId: listFinancialProfiles
      tags: [financial-profiles]
      responses:
        "200":
          description: Financial profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FinancialProfile"
    post:
      operationId: createFinancialProfile
      tags: [financial-profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialProfileInput"
      responses:
        "201":
          description: Created financial profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfile"
  /financial-profiles/{profileId}:
    patch:
      operationId: updateFinancialProfile
      tags: [financial-profiles]
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialProfileUpdate"
      responses:
        "200":
          description: Updated financial profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialProfile"
        "400":
          description: Only business profile fields can be updated
        "404":
          description: Financial profile not found
    delete:
      operationId: deleteFinancialProfile
      tags: [financial-profiles]
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Financial profile deleted
        "400":
          description: The personal profile cannot be deleted
        "404":
          description: Financial profile not found
  /investments:
    get:
      operationId: listInvestments
      tags: [investments]
      responses:
        "200":
          description: Personal investment portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
        "403":
          description: Investments are only available for personal profiles
    post:
      operationId: createInvestment
      tags: [investments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentInput"
      responses:
        "201":
          description: Investment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
        "400":
          description: Invalid investment
        "403":
          description: Investments are only available for personal profiles
  /investments/search:
    get:
      operationId: searchInvestments
      tags: [investments]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 40
      responses:
        "200":
          description: Investment assets matching the search
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvestmentSearchResult"
        "400":
          description: Search query is too short or invalid
        "403":
          description: Investments are only available for personal profiles
        "502":
          description: Investment catalog provider unavailable
  /investments/favorites:
    get:
      operationId: listInvestmentFavorites
      tags: [investments]
      responses:
        "200":
          description: Saved investment catalog favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvestmentFavorite"
        "403":
          description: Investments are only available for personal profiles
    post:
      operationId: createInvestmentFavorite
      tags: [investments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentFavoriteInput"
      responses:
        "201":
          description: Investment catalog favorite saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentFavorite"
        "400":
          description: Invalid investment favorite
        "403":
          description: Investments are only available for personal profiles
  /investments/favorites/{id}:
    delete:
      operationId: deleteInvestmentFavorite
      tags: [investments]
      parameters:
        - $ref: "#/components/parameters/InvestmentFavoriteId"
      responses:
        "204":
          description: Investment catalog favorite removed
        "403":
          description: Investments are only available for personal profiles
        "404":
          description: Investment catalog favorite not found
  /investments/{id}:
    patch:
      operationId: updateInvestment
      tags: [investments]
      parameters:
        - $ref: "#/components/parameters/InvestmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentUpdate"
      responses:
        "200":
          description: Investment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
        "400":
          description: Invalid investment
        "403":
          description: Investments are only available for personal profiles
        "404":
          description: Investment not found
    delete:
      operationId: deleteInvestment
      tags: [investments]
      parameters:
        - $ref: "#/components/parameters/InvestmentId"
      responses:
        "204":
          description: Investment removed
        "403":
          description: Investments are only available for personal profiles
        "404":
          description: Investment not found
  /investments/refresh:
    post:
      operationId: refreshInvestmentQuotes
      tags: [investments]
      summary: Refresh automatic investment quotes
      responses:
        "200":
          description: Investment portfolio with the latest available quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"
        "403":
          description: Investments are only available for personal profiles
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      responses:
        "200":
          description: User transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: clearTransactions
      tags: [transactions]
      responses:
        "204":
          description: Transactions removed
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "204":
          description: Transaction removed
        "404":
          description: Not found
  /transactions/{id}/occurrences/{occurrenceDate}/payment-status:
    patch:
      operationId: updateTransactionOccurrencePaymentStatus
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - name: occurrenceDate
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
  /transactions/batch-delete:
    post:
      operationId: deleteTransactions
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBatchDelete"
      responses:
        "204":
          description: Transactions removed
  /transactions/batch-update:
    post:
      operationId: updateTransactions
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBatchUpdate"
      responses:
        "204":
          description: Transactions updated
  /wallets:
    get:
      operationId: listWallets
      tags: [wallets]
      responses:
        "200":
          description: User wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
    post:
      operationId: createWallet
      tags: [wallets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletInput"
      responses:
        "201":
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      responses:
        "200":
          description: User categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [categories]
      parameters:
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Category removed
        "404":
          description: Not found
  /limits:
    get:
      operationId: listLimits
      tags: [limits]
      responses:
        "200":
          description: User spending limits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Limit"
    post:
      operationId: createLimit
      tags: [limits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitInput"
      responses:
        "201":
          description: Created spending limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limit"
  /limits/{id}:
    patch:
      operationId: updateLimit
      tags: [limits]
      parameters:
        - $ref: "#/components/parameters/LimitId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitUpdate"
      responses:
        "200":
          description: Updated spending limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limit"
        "404":
          description: Not found
    delete:
      operationId: deleteLimit
      tags: [limits]
      parameters:
        - $ref: "#/components/parameters/LimitId"
      responses:
        "204":
          description: Spending limit removed
        "404":
          description: Not found
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      responses:
        "200":
          description: User savings goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200":
          description: Savings goal details and history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalDetail"
        "404":
          description: Not found
    patch:
      operationId: updateGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated savings goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "204":
          description: Goal removed
        "404":
          description: Not found
  /goals/{id}/movements:
    post:
      operationId: createGoalMovement
      tags: [goals]
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalMovementInput"
      responses:
        "201":
          description: Goal movement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalMovement"
        "400":
          description: Invalid movement
        "404":
          description: Not found
  /cards:
    get:
      operationId: listCards
      tags: [cards]
      responses:
        "200":
          description: User credit cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
    post:
      operationId: createCard
      tags: [cards]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardInput"
      responses:
        "201":
          description: Created credit card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
  /cards/{id}:
    get:
      operationId: getCard
      tags: [cards]
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Credit card details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Not found
    patch:
      operationId: updateCard
      tags: [cards]
      parameters:
        - $ref: "#/components/parameters/CardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdate"
      responses:
        "200":
          description: Updated credit card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Not found
    delete:
      operationId: deleteCard
      tags: [cards]
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "204":
          description: Credit card removed
        "404":
          description: Not found
  /cards/{id}/pay-invoice:
    post:
      operationId: payCardInvoice
      tags: [cards]
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Credit card invoice paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Not found
  /cards/{id}/history:
    get:
      operationId: getCardHistory
      tags: [cards]
      parameters:
        - $ref: "#/components/parameters/CardId"
      responses:
        "200":
          description: Current card invoice history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardHistoryItem"
        "404":
          description: Not found
  /wallets/{id}:
    patch:
      operationId: updateWallet
      tags: [wallets]
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletUpdate"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: Not found
    delete:
      operationId: deleteWallet
      tags: [wallets]
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "204":
          description: Wallet removed
        "404":
          description: Not found
  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Permanently delete the authenticated account
      responses:
        "204":
          description: Account and all financial data removed
        "401":
          description: Unauthorized
  /account/profile:
    patch:
      operationId: updateAccountProfile
      tags: [account]
      summary: Update the authenticated user's profile name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "204":
          description: Profile updated
        "400":
          description: Invalid profile name
        "401":
          description: Unauthorized
  /account/profile-image:
    patch:
      operationId: updateAccountProfileImage
      tags: [account]
      summary: Update the authenticated user's profile image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImageUpdate"
      responses:
        "204":
          description: Profile image updated
        "400":
          description: Invalid image
        "401":
          description: Unauthorized
  /legal-documents:
    get:
      operationId: listLegalDocuments
      tags: [legal]
      summary: List public legal documents
      responses:
        "200":
          description: Public legal documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalDocument"
  /legal-documents/{documentKey}:
    get:
      operationId: getLegalDocument
      tags: [legal]
      summary: Get one public legal document
      parameters:
        - name: documentKey
          in: path
          required: true
          schema:
            type: string
            enum: [privacy, terms, contact]
      responses:
        "200":
          description: Public legal document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
        "404":
          description: Document not found
  /privacy/consents:
    get:
      operationId: listPrivacyConsents
      tags: [privacy]
      summary: List the authenticated user's document consents
      responses:
        "200":
          description: Consent history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyConsentList"
    post:
      operationId: recordPrivacyConsent
      tags: [privacy]
      summary: Accept or revoke a legal document consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyConsentInput"
      responses:
        "201":
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyConsent"
        "204":
          description: Consent revoked
  /privacy/requests:
    get:
      operationId: listPrivacyRequests
      tags: [privacy]
      summary: List the authenticated user's privacy requests
      responses:
        "200":
          description: Privacy requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivacyRequest"
    post:
      operationId: createPrivacyRequest
      tags: [privacy]
      summary: Create a data subject rights request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "201":
          description: Privacy request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequest"
  /privacy/export:
    get:
      operationId: exportPrivacyData
      tags: [privacy]
      summary: Export the authenticated user's account and financial data
      responses:
        "200":
          description: JSON data export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /support/requests:
    get:
      operationId: listSupportRequests
      tags: [support]
      summary: List the authenticated user's support requests
      responses:
        "200":
          description: Support requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportRequest"
    post:
      operationId: createSupportRequest
      tags: [support]
      summary: Create an in-app support request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportRequestInput"
      responses:
        "201":
          description: Support request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRequest"
components:
  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WalletId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LimitId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvestmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvestmentFavoriteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LegalDocument:
      type: object
      required: [key, title, version, isDraft, lastUpdated, requiresAcceptance, body]
      properties:
        key: { type: string, enum: [privacy, terms, contact] }
        title: { type: string }
        version: { type: string }
        isDraft: { type: boolean }
        lastUpdated: { type: string, format: date }
        requiresAcceptance: { type: boolean }
        body:
          type: array
          items: { type: string }
    PrivacyConsent:
      type: object
      required: [id, documentKey, documentVersion, acceptedAt, revokedAt, active]
      properties:
        id: { type: string, format: uuid }
        documentKey: { type: string, enum: [privacy, terms, communications] }
        documentVersion: { type: string }
        acceptedAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        active: { type: boolean }
    PrivacyConsentList:
      type: object
      required: [currentDocumentVersion, consents]
      properties:
        currentDocumentVersion: { type: string }
        consents:
          type: array
