openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Authenticated financial transaction operations
  - name: wallets
    description: Authenticated wallet management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      responses:
        "200":
          description: User transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
    delete:
      operationId: clearTransactions
      tags: [transactions]
      responses:
        "204":
          description: Transactions removed
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "204":
          description: Transaction removed
        "404":
          description: Not found
  /transactions/{id}/occurrences/{occurrenceDate}/payment-status:
    patch:
      operationId: updateTransactionOccurrencePaymentStatus
      tags: [transactions]
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - name: occurrenceDate
          in: path
          required: true
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusUpdate"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
  /transactions/batch-delete:
    post:
      operationId: deleteTransactions
      tags: [transactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionBatchDelete"
      responses:
        "204":
          description: Transactions removed
  /wallets:
    get:
      operationId: listWallets
      tags: [wallets]
      responses:
        "200":
          description: User wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"
    post:
      operationId: createWallet
      tags: [wallets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletInput"
      responses:
        "201":
          description: Created wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /wallets/{id}:
    patch:
      operationId: updateWallet
      tags: [wallets]
      parameters:
        - $ref: "#/components/parameters/WalletId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletUpdate"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: Not found
    delete:
      operationId: deleteWallet
      tags: [wallets]
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "204":
          description: Wallet removed
        "404":
          description: Not found
components:
  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WalletId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Recurrence:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, recurring]
        interval:
          type: integer
          minimum: 1
        unit:
          type: string
          enum: [day, week, month, year]
        frequency:
          type: string
          enum: [monthly, weekly, yearly]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        occurrences:
          type: integer
          minimum: 1
    Transaction:
      type: object
      required: [id, walletId, type, amount, description, date, recurrence, paymentStatus, paymentStatusOverrides, createdAt]
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string }
        date: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        paymentStatus: { type: string, enum: [paid, unpaid] }
        paymentStatusOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [paid, unpaid]
        createdAt: { type: string, format: date-time }
    TransactionInput:
      type: object
      required: [type, amount, description, date, recurrence, paymentStatus]
      properties:
        walletId: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string, minLength: 1 }
        date: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        paymentStatus: { type: string, enum: [paid, unpaid] }
    TransactionUpdate:
      type: object
      properties:
        walletId: { type: string, format: uuid }
        type: { type: string, enum: [income, expense] }
        amount: { type: number, exclusiveMinimum: 0 }
        description: { type: string, minLength: 1 }
        date: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        recurrence:
          $ref: "#/components/schemas/Recurrence"
        paymentStatus: { type: string, enum: [paid, unpaid] }
        paymentStatusOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [paid, unpaid]
    PaymentStatusUpdate:
      type: object
      required: [paymentStatus]
      properties:
        paymentStatus: { type: string, enum: [paid, unpaid] }
    TransactionBatchDelete:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    Wallet:
      type: object
      required: [id, title, initialBalance, icon, isDefault, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        initialBalance: { type: number, minimum: 0 }
        icon:
          type: string
          enum: [wallet-outline, bank-outline, credit-card-outline, cash, safe-square-outline, wallet, briefcase-outline, bank-transfer, finance, card-account-details-outline]
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
    WalletInput:
      type: object
      required: [title, initialBalance, icon]
      properties:
        title: { type: string, minLength: 1 }
        initialBalance: { type: number, minimum: 0 }
        icon:
          type: string
          enum: [wallet-outline, bank-outline, credit-card-outline, cash, safe-square-outline, wallet, briefcase-outline, bank-transfer, finance, card-account-details-outline]
    WalletUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        initialBalance: { type: number, minimum: 0 }
        icon:
          type: string
          enum: [wallet-outline, bank-outline, credit-card-outline, cash, safe-square-outline, wallet, briefcase-outline, bank-transfer, finance, card-account-details-outline]

